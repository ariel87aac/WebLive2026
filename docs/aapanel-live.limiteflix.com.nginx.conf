server {
    listen 80;
    server_name live.limiteflix.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name live.limiteflix.com;

    # aaPanel normally manages these certificate paths from the SSL tab.
    ssl_certificate /www/server/panel/vhost/cert/live.limiteflix.com/fullchain.pem;
    ssl_certificate_key /www/server/panel/vhost/cert/live.limiteflix.com/privkey.pem;

    root /www/wwwroot/weblive2026/frontend/dist/frontend/browser;
    index index.html;

    location = /weblive-config.js {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

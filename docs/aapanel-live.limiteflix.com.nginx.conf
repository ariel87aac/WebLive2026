server {
    listen 80;
    server_name live.limiteflix.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name live.limiteflix.com;

    # aaPanel normally manages these certificate paths from the SSL tab.
    ssl_certificate /www/server/panel/vhost/cert/live.limiteflix.com/fullchain.pem;
    ssl_certificate_key /www/server/panel/vhost/cert/live.limiteflix.com/privkey.pem;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
